# 릴리스 빌드: GitHub의 Windows 서버에서 설치 파일을 만들고, 실제로 설치해 본 뒤 Releases에 올린다.
# 실행: GitHub → Actions → "릴리스 빌드" → Run workflow → 버전 입력 (version.json·SSNnote.iss와 같아야 함)
# 앱은 GitHub 최신 릴리스를 보고 자동 업데이트한다 (예전의 Gist 갱신은 쓰지 않음).
# dry_run: 릴리스를 만들지 않고 빌드·점검·설치 시험까지만.
name: 릴리스 빌드

on:
  workflow_dispatch:
    inputs:
      version:
        description: '버전 (예: v2.67)'
        required: true
      dry_run:
        description: '시험만 (릴리스를 만들지 않음)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  # 입력값은 스크립트 글자에 직접 넣지 않고 환경 변수로만 넘긴다 (명령 주입 방지)
  VERSION: ${{ inputs.version }}

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 버전 확인 (version.json · SSNnote.iss · 입력값)
        run: |
          $want = $env:VERSION
          if ($want -notmatch '^v\d+\.\d+(\.\d+)?$') { throw "버전 형식이 올바르지 않습니다: $want (예: v2.70)" }
          $v = (Get-Content version.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          if ($v -ne $want) { throw "version.json 버전($v)이 입력($want)과 다릅니다" }
          $iss = (Select-String -Path SSNnote.iss -Pattern '^AppVersion=(.+)$').Matches[0].Groups[1].Value
          if ("v$iss" -ne $want) { throw "SSNnote.iss AppVersion($iss)이 입력($want)과 다릅니다" }
          gh release view $want *> $null
          if ($LASTEXITCODE -eq 0 -and $env:DRY_RUN -ne 'true') { throw "릴리스 $want 가 이미 있습니다" }
          exit 0   # 'release view'가 없음(1)으로 끝나도 이 단계는 성공
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          # 빌드에서 제외하는 무거운 패키지(SSNnote.spec excludes)는 설치하지 않음
          Get-Content requirements.txt | Where-Object { $_ -notmatch '^(sentence-transformers|scikit-learn)' } | Set-Content req-ci.txt
          pip install -r req-ci.txt pyinstaller pytest

      - name: 테스트
        run: python -m pytest tests -q

      - name: PyInstaller (SSNnote.exe)
        run: |
          pyinstaller SSNnote.spec --noconfirm
          if (-not (Test-Path dist\SSNnote\SSNnote.exe)) { throw 'SSNnote.exe 없음' }

      - name: 빌드된 앱 자체 점검 (메모·공문 작성·예산 창 실제로 열기)
        timeout-minutes: 5
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'selfcheck.txt'
          $p = Start-Process -FilePath dist\SSNnote\SSNnote.exe -ArgumentList '--self-check', "`"$out`"" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out -Encoding utf8 } else { throw '자체 점검 결과 파일이 없습니다 (앱이 시작하지 못함)' }
          if ($p.ExitCode -ne 0) { throw "자체 점검 실패 (exit $($p.ExitCode)) — 위 FAIL 항목 확인" }

      - name: Inno Setup (SSNnote_Setup.exe)
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" SSNnote.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC 실패' }

      - name: SHA256
        id: sha
        run: |
          $h = (Get-FileHash dist\SSNnote_Setup.exe -Algorithm SHA256).Hash
          "sha256=$h" >> $env:GITHUB_OUTPUT
          Write-Host "SHA256: $h"

      - uses: actions/upload-artifact@v4
        with:
          name: SSNnote_Setup-${{ inputs.version }}
          path: dist/SSNnote_Setup.exe

      - name: 설치 시험 (지난 판 → 새 판, 자동 업데이트처럼 화면 없이)
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $id = '{12345678-1234-1234-1234-123456789012}}_is1'   # AppId={{…}} → 앞의 {{만 {로 바뀜
          $u = 'Microsoft\Windows\CurrentVersion\Uninstall\' + $id
          $hkcuKey = "HKCU:\Software\$u"
          $hklmKeys = @("HKLM:\SOFTWARE\WOW6432Node\$u", "HKLM:\SOFTWARE\$u")
          # 설치 기록(제거 정보) 확인은 Windows의 reg 명령으로 (32비트 보기 포함)
          function HasKey($path) {
            $k = $path -replace '^HKCU:\\', 'HKCU\' -replace '^HKLM:\\', 'HKLM\'
            foreach ($view in @('/reg:32', '/reg:64')) { & reg.exe query $k $view *> $null; if ($LASTEXITCODE -eq 0) { Write-Host "있음: $k $view"; return $true } }
            $global:LASTEXITCODE = 0
            return $false
          }
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $runName = '서서니 메모'
          $silent = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CLOSEAPPLICATIONS', '/FORCECLOSEAPPLICATIONS')
          # 설치 프로그램만 기다린다 (-Wait는 설치 뒤 다시 켜진 앱까지 기다려 버림)
          function RunSetup($exe, $argv) { $p = Start-Process $exe -ArgumentList $argv -PassThru; $null = $p.Handle; $p.WaitForExit(); return $p.ExitCode }
          function InstallDir {
            foreach ($root in @('HKCU:\Software', 'HKLM:\SOFTWARE\WOW6432Node', 'HKLM:\SOFTWARE')) {
              $k = Get-ChildItem "$root\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue |
                   Where-Object { $_.PSChildName -eq $id } | Select-Object -First 1
              if ($k) { $loc = (Get-ItemProperty $k.PSPath).InstallLocation; Write-Host "설치 기록: $($k.Name) → $loc"; if ($loc) { return $loc.TrimEnd('\') } }
            }
            foreach ($d in @("${env:ProgramFiles(x86)}\SSNnote", "$env:ProgramFiles\SSNnote", "$env:LOCALAPPDATA\Programs\SSNnote")) {
              if (Test-Path "$d\SSNnote.exe") { Write-Host "설치 폴더 발견: $d"; return $d }
            }
            return $null
          }

          # 1) 지난 릴리스를 설치 (사용자가 지금 쓰는 판)
          gh release download --repo $env:GITHUB_REPOSITORY --pattern SSNnote_Setup.exe --dir old
          $rc = RunSetup old\SSNnote_Setup.exe ($silent + '/NORELAUNCH')
          if ($rc -ne 0) { throw "지난 판 설치 실패 ($rc)" }
          Start-Sleep 3; Get-Process SSNnote -ErrorAction SilentlyContinue | Stop-Process -Force
          $oldDir = InstallDir
          Write-Host "지난 판 위치: $oldDir"
          if (-not $oldDir -or -not (Test-Path "$oldDir\SSNnote.exe")) { throw '지난 판이 설치되지 않음' }
          New-ItemProperty -Path $runKey -Name $runName -Value "`"$oldDir\SSNnote.exe`"" -PropertyType String -Force | Out-Null

          # 2) 새 판을 자동 업데이트와 같은 방식으로 설치 → 앱이 다시 켜져야 함
          $rc = RunSetup dist\SSNnote_Setup.exe $silent
          if ($rc -ne 0) { throw "새 판 설치 실패 ($rc)" }
          $newDir = "$env:LOCALAPPDATA\Programs\SSNnote"
          if (-not (Test-Path "$newDir\SSNnote.exe")) { throw "사용자 폴더에 설치되지 않음: $newDir" }
          if (Test-Path "$newDir\SSNnote_MCP.exe") { throw '지난 판의 연결 프로그램(SSNnote_MCP.exe)이 지워지지 않음' }
          if (-not (HasKey $hkcuKey)) { & reg.exe query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall' /s /f SSNnote; throw '사용자 설치 기록(HKCU)이 없음' }
          if ($oldDir -ne $newDir) {
            if (Test-Path "$oldDir\SSNnote.exe") { throw "예전 위치의 프로그램이 지워지지 않음: $oldDir" }
            foreach ($k in $hklmKeys) { if (HasKey $k) { throw "예전 관리자 설치 기록이 남음: $k" } }
          }
          $run = (Get-ItemProperty $runKey).$runName
          if ($run -ne "`"$newDir\SSNnote.exe`"") { throw "자동 시작이 새 위치를 가리키지 않음: $run" }
          Start-Sleep 5
          $proc = Get-Process SSNnote -ErrorAction SilentlyContinue
          if (-not $proc) { throw '설치 뒤 앱이 다시 켜지지 않음' }
          Write-Host "다시 켜진 앱: $($proc[0].Path)"

          # 3) 앱이 켜진 채로 /NORELAUNCH 설치 (앱을 끄면서 설치하는 경우) → 앱을 닫고 설치, 다시 켜지 않음
          $rc = RunSetup dist\SSNnote_Setup.exe ($silent + '/NORELAUNCH')
          if ($rc -ne 0) { throw "켜진 채 설치 실패 ($rc)" }
          Start-Sleep 3
          if (Get-Process SSNnote -ErrorAction SilentlyContinue) { throw '/NORELAUNCH인데 앱이 켜져 있음' }
          Write-Host '설치 시험 통과'

      - name: GitHub Release 생성
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = (Get-Content version.json -Raw -Encoding utf8 | ConvertFrom-Json).changelog
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\notes.md", $notes, [Text.UTF8Encoding]::new($false))
          gh release create $env:VERSION dist/SSNnote_Setup.exe --title $env:VERSION --notes-file "$env:RUNNER_TEMP\notes.md" --target $env:GITHUB_SHA
